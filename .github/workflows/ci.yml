name: AkrGym CI

on:
  push:
    # QA é onde o trabalho é feito; PRD é o que está no ar.
    branches: [QA, PRD]
  pull_request:
    branches: [PRD]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # O emulador do Firestore (firebase-tools 15) exige Java 21.
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Firestore rules tests
        run: npm run test:rules

      # Só o que vai para o site; ferramentas de desenvolvimento ficam de fora.
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build
