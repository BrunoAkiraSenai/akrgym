name: AkrGym Deploy

on:
  workflow_dispatch:
  push:
    # PRD é a única branch que publica automaticamente no site.
    branches: [PRD]

permissions:
  contents: read

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Firestore rules tests
        run: npm run test:rules

      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      # Secrets necessários no GitHub (Settings > Secrets and variables > Actions):
      #   VITE_RECAPTCHA_ENTERPRISE_SITE_KEY  chave pública do reCAPTCHA (App Check)
      #   FIREBASE_SERVICE_ACCOUNT_AKRGYM     JSON da conta de serviço de deploy
      # Este workflow publica só o site. Regras do Firestore e o Worker da IA
      # continuam sendo publicados à mão quando mudam.
      - name: Build
        env:
          VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
        run: npm run check:production && npm run build

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AKRGYM }}
          projectId: akrgym
          channelId: live
